name: CI
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Publication guard and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviewed public source files
        run: python3 scripts/publication_guard.py
      - name: Secrets in the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="HEAD~1..HEAD"
          if ! git rev-parse -q --verify "HEAD~1" >/dev/null; then range="HEAD"; fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..HEAD"; fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --log-opts="$range" --redact --no-banner

  test:
    name: Type check, lint, tests and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx jest --ci
      # the compiled catalogs (messages.ts) are committed: they must match the .po files
      - name: Translations compile and are up to date
        run: |
          npx lingui compile --typescript
          git diff --exit-code -- src/i18n/locales
