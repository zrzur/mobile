name: iOS build
# Manual only (macOS runners cost ten times the minutes of Linux ones).
#
# Builds the app for the iOS Simulator, unsigned, and keeps the zipped .app
# as a workflow artifact. It runs in Xcode's simulator only: a build that
# installs on a real iPhone or iPad needs the project's Apple Developer
# signing (certificate and provisioning profile), or EAS Build with the
# project's Expo account. Neither is set up yet, and this workflow needs
# no secrets. Nothing is uploaded to the App Store or TestFlight.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ios/ is generated from app.json and its config plugins, never kept in Git
      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install
      - name: Pod install
        working-directory: ios
        run: pod install
      # release builds always use https://api.zrzur.com (src/lib/apiUrl.ts)
      - name: xcodebuild for the simulator, without signing
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Zip the .app
        run: |
          set -euo pipefail
          app=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          mkdir -p out
          ditto -c -k --keepParent "$app" out/zrzur-mobile-ios-simulator-unsigned.zip
          (cd out && shasum -a 256 *.zip | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zrzur-mobile-ios-simulator-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 14
