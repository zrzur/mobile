name: Android build
# Builds a release APK on GitHub's runner and keeps it as a workflow artifact.
# Nothing is published to Google Play or anywhere else; a maintainer downloads
# and tests the file by hand. No Expo or EAS account is needed.
#
# Signing: when the repository has the four secrets below, the APK is signed
# with that key. Without them it stays signed with the debug key and the
# artifact is named "TEST-debug-signed": fine for testing, not for a store.
#   ANDROID_KEYSTORE_BASE64    the keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_type != 'tag' }}
      - run: npm ci
      # android/ is generated from app.json and its config plugins, never kept in Git
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
      # release builds always use https://api.zrzur.com (src/lib/apiUrl.ts)
      - name: Gradle assembleRelease
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign with the release key, if the repository has one
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          mkdir -p out
          version=$(node -p "require('./app.json').expo.version")
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
            name="zrzur-mobile-android-${version}-$(echo "$REF_NAME" | tr '/' '-')-release"
            # a key without its own password uses the keystore password
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            # apksigner replaces the debug signature with the release one
            "$apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "out/$name.apk" "$apk"
            "$apksigner" verify --print-certs "out/$name.apk" | grep -E '^Signer #1 certificate (DN|SHA-256)'
            rm -f "$keystore"
          else
            name="zrzur-mobile-android-TEST-debug-signed"
            echo "::warning::No release keystore secrets: the APK is signed with the debug key (test build only)."
            cp "$apk" "out/$name.apk"
          fi
          (cd out && sha256sum "$name.apk" | tee SHA256SUMS.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.sign.outputs.name }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
